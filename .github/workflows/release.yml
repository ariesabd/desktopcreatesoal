name: "Build SoalCreator Desktop v2.0 (.exe & .msi)"
run-name: "Build SoalCreator Desktop v2.0 EXE [${{ github.ref_name }}]"

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Tauri Desktop (.exe & .msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'SoalCreator Desktop v__VERSION__'
          releaseBody: |
            ## 🚀 Lufya CBT - SoalCreator Studio Desktop v2.0 Release

            Aplikasi Desktop Mandiri Pembuat Soal Word & Excel CBT dengan Konverter LaTeX KaTeX (100% Standalone Offline).

            ### Fitur Unggulan v2.0:
            - **Konverter Persamaan Matematika Word ke LaTeX KaTeX:** Konversi otomatis Limit, Turunan, Pecahan, Akar, Integral, dan Simbol Eksakta.
            - **Rendering KaTeX Ultra-Cepat:** Pratinjau visual formula matematika presisi tinggi.
            - **Studio Multi-Mapel:** Studio Matematika & Sains, Studio Bahasa Arab & PAI (RTL + Virtual Harakat Keyboard), Studio Umum, dan AI Prompt Lab.
            - **Ekspor Word (.docx):** Format Tabel 3-Kolom resmi CBT & Format Linier Siap Cetak.
            - **Ekspor Excel (.xlsx):** Format standar 11-kolom template import Lufya CBT.
            - **100% Offline & Ringan:** Tanpa perlu koneksi internet, tanpa XAMPP, dan hemat RAM.
          releaseDraft: false
          prerelease: false
          tauriScript: npx tauri

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creatorsoal-windows-build
          path: |
            src-tauri/target/release/creatorsoal.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
